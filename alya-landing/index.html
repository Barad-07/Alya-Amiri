<script>
  /* Runs before paint: language, direction, motion preference, intro state */
  (function (d) {
    var r = d.documentElement, lang = 'ar';
    try { var s = localStorage.getItem('alya-lang'); if (s === 'en' || s === 'ar') lang = s; } catch (e) {}
    r.lang = lang; r.dir = lang === 'ar' ? 'rtl' : 'ltr';
    r.classList.add('js');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) r.classList.add('motion');
    try { if (r.classList.contains('motion') && !sessionStorage.getItem('alya-intro')) { r.classList.add('is-arriving'); sessionStorage.setItem('alya-intro', '1'); } } catch (e) {}
    setTimeout(function () { r.classList.remove('is-arriving'); r.classList.add('is-ready'); }, 3000);
  })(document);
</script>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "LegalService", "name": "Alya Al Ameri", "alternateName": "علياء العامري", "url": "https://example.com/", "image": "https://example.com/assets/images/og-cover.jpg", "areaServed": {"@type": "Country", "name": "United Arab Emirates"}, "availableLanguage": ["ar", "en"], "founder": {"@type": "Person", "name": "Alya Al Ameri"}}</script>

<body data-page="home">
<div data-partial="header"></div>
<main id="main" tabindex="-1">

<!-- ============================================================ HERO -->
<section class="hero" id="top">
  <div class="wrap grid hero__grid">
    <div class="hero__text">
      <p class="clause hero__eyebrow" data-hero="1"><span class="clause__mark">§</span><span data-i18n="hero.eyebrowA"></span><span aria-hidden="true">—</span><span data-i18n-html="hero.eyebrowB"></span></p>
      <h1 class="hero__title" data-i18n-lines="hero.title"></h1>
      <div class="hero__intro" data-hero="2">
        <p data-i18n="hero.intro"></p>
        <div class="hero__ctas">
          <a class="btn" href="#contact"><span data-i18n="hero.ctaPrimary"></span><svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg></a>
          <a class="btn btn--line" href="#practice"><span data-i18n="hero.ctaSecondary"></span></a>
        </div>
      </div>
    </div>
    <div class="hero__media">
      <div class="arch">
        <div class="parallax-inner" data-parallax="0.16"><img src="assets/images/hero-arch.jpg" alt="Abstract arch in warm light (placeholder image)" fetchpriority="high" decoding="async"></div>
      </div>
      <aside class="hero__note" data-hero="3">
        <span class="label" data-i18n="hero.noteLabel"></span>
        <p data-i18n="hero.noteText"></p>
      </aside>
    </div>
  </div>
  <div class="wrap">
    <ul class="hero__meta label" data-hero="3">
      <li><span class="clause__mark">—</span><span data-i18n="hero.meta1"></span></li>
      <li><span class="clause__mark">—</span><span data-i18n="hero.meta2"></span></li>
      <li><span class="clause__mark">—</span><span data-i18n-html="hero.meta3"></span></li>
    </ul>
  </div>
  <span class="hero__scroll label" aria-hidden="true" data-i18n="hero.scroll"></span>
</section>

<!-- ============================================================ STATEMENT -->
<section class="section statement">
  <div class="wrap grid statement__grid">
    <div class="statement__aside"><span class="clause"><span class="clause__mark">§</span><span data-i18n="statement.label"></span></span></div>
    <div class="statement__body">
      <p class="statement__text" data-words-scroll data-i18n-words="statement.text"></p>
      <div class="statement__foot" data-reveal="up"><span class="signature" data-i18n="brand.name"></span></div>
    </div>
  </div>
</section>

<!-- ============================================================ ABOUT -->
<section class="section on-paper" id="about" data-section>
  <div class="wrap">
    <div class="grid about-intro__grid">
      <figure class="about-intro__media" style="margin:0">
        <div class="arch" data-reveal="mask" style="aspect-ratio:4/5"><div class="parallax-inner" data-parallax="0.12"><img src="assets/images/about-portrait.jpg" alt="Placeholder image, not a photograph of Alya Al Ameri" loading="lazy"></div></div>
        <figcaption class="label"><span class="ph" data-i18n="about.portraitCaption"></span></figcaption>
      </figure>
      <div class="about-intro__text">
        <span class="clause"><span class="clause__mark">§</span><span data-i18n="about.label"></span></span>
        <h2 class="display-lg" data-reveal="up" data-i18n-html="about.title"></h2>
        <div class="prose" data-reveal="up" data-render="about-intro"></div>
        <div class="prose" data-reveal="up" data-render="about-bio"></div>
      </div>
    </div>
    <div class="about__facts">
      <p class="label" style="margin-bottom:16px" data-i18n="about.qualLabel"></p>
      <div class="facts" data-stagger data-render="about-quals"></div>
    </div>
  </div>
</section>

<!-- ============================================================ PRACTICE -->
<section class="section practice on-dark" id="practice" data-section>
  <div class="wrap">
    <div class="section-head">
      <div>
        <span class="clause"><span class="clause__mark">§</span><span data-i18n="practice.label"></span></span>
        <h2 class="display-xl" data-reveal="up" data-i18n-html="practice.title"></h2>
      </div>
      <p class="muted" data-reveal="up" data-i18n="practice.text"></p>
    </div>
    <div data-render="practice"></div>
  </div>
  <div class="practice__preview" aria-hidden="true"></div>
</section>

<!-- ============================================================ METHOD -->
<section class="section approach" id="approach" data-section>
  <div class="wrap grid approach__grid">
    <div class="approach__sticky">
      <span class="clause"><span class="clause__mark">§</span><span data-i18n="approach.label"></span></span>
      <h2 class="display-xl" data-reveal="up" data-i18n-html="approach.title"></h2>
      <p class="lead muted" data-reveal="up" data-i18n="approach.text"></p>
      <figure class="approach__figure" style="margin:40px 0 0">
        <div class="frame frame--wide" data-reveal="mask"><img src="assets/images/approach.jpg" alt="Light falling through a colonnade (placeholder image)" loading="lazy"></div>
      </figure>
    </div>
    <ol class="approach__steps" data-render="steps"></ol>
  </div>
</section>

<!-- ============================================================ WORK -->
<section class="hscroll on-dark" id="work" data-section data-hscroll>
  <div class="hscroll__pin">
    <div class="wrap hscroll__head">
      <div>
        <span class="clause"><span class="clause__mark">§</span><span data-i18n="work.label"></span></span>
        <h2 class="display-xl" style="margin-top:24px" data-reveal="up" data-i18n-html="work.title"></h2>
      </div>
      <p class="label" style="max-width:32ch" data-i18n="work.note"></p>
    </div>
    <div class="hscroll__track" data-render="work"></div>
    <div class="wrap"><div class="hscroll__progress" aria-hidden="true"><span></span></div></div>
  </div>
</section>

<!-- ============================================================ CONTACT -->
<section class="section" id="contact" data-section>
  <div class="wrap">
    <div class="contact-head">
      <span class="clause"><span class="clause__mark">§</span><span data-i18n="contact.label"></span></span>
      <h2 class="contact-head__title" data-reveal="up" data-i18n-html="contact.title"></h2>
      <p class="lead muted" data-reveal="up" data-i18n="contact.lead"></p>
    </div>
    <div class="grid contact__grid">
      <div class="contact__info">
        <div>
          <h3 class="label" style="margin-bottom:16px" data-i18n="contact.methods"></h3>
          <div class="methods" data-render="contact-methods"></div>
        </div>
        <a class="btn btn--line" href="#contact" data-whatsapp-cta style="justify-self:start"><span data-i18n="contact.openWhatsapp"></span><svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg></a>
        <div class="arch" data-reveal="mask" style="max-width:340px;aspect-ratio:4/5"><div class="parallax-inner" data-parallax="0.1"><img src="assets/images/contact.jpg" alt="Stone staircase in soft light (placeholder image)" loading="lazy"></div></div>
      </div>

      <div class="contact__form-wrap">
        <h3 class="display-md" style="margin-bottom:40px" data-reveal="up" data-i18n="contact.formTitle"></h3>
        <form class="form" id="consult-form" novalidate>
          <div class="field">
            <label for="f-name" data-i18n="contact.name"></label>
            <input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="e-name" data-i18n-attr="placeholder:contact.namePh">
            <span class="field__bar"></span><span class="field__error" id="e-name" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="f-email" data-i18n="contact.emailField"></label>
            <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" dir="ltr" required aria-describedby="e-email" data-i18n-attr="placeholder:contact.emailFieldPh">
            <span class="field__bar"></span><span class="field__error" id="e-email" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="f-phone" data-i18n="contact.phoneField"></label>
            <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" dir="ltr" aria-describedby="e-phone" data-i18n-attr="placeholder:contact.phoneFieldPh">
            <span class="field__bar"></span><span class="field__error" id="e-phone" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="f-matter" data-i18n="contact.matter"></label>
            <select id="f-matter" name="matter" required aria-describedby="e-matter"></select>
            <span class="field__bar"></span><span class="field__error" id="e-matter" aria-live="polite"></span>
          </div>
          <fieldset class="field">
            <legend data-i18n="contact.langPref"></legend>
            <div class="radio-row"><label for="f-lang-ar"><input type="radio" id="f-lang-ar" name="language" value="ar"><span data-i18n="contact.langAr"></span></label><label for="f-lang-en"><input type="radio" id="f-lang-en" name="language" value="en"><span data-i18n="contact.langEn"></span></label></div>
          </fieldset>
          <fieldset class="field">
            <legend data-i18n="contact.method"></legend>
            <div class="radio-row"><label for="f-m-email"><input type="radio" id="f-m-email" name="method" value="email"><span data-i18n="contact.methodEmail"></span></label><label for="f-m-phone"><input type="radio" id="f-m-phone" name="method" value="phone"><span data-i18n="contact.methodPhone"></span></label><label for="f-m-wa"><input type="radio" id="f-m-wa" name="method" value="whatsapp"><span data-i18n="contact.methodWhatsapp"></span></label></div>
          </fieldset>
          <div class="field form__full">
            <label for="f-message" data-i18n="contact.message"></label>
            <textarea id="f-message" name="message" rows="5" required aria-describedby="e-message" data-i18n-attr="placeholder:contact.messagePh"></textarea>
            <span class="field__bar"></span><span class="field__error" id="e-message" aria-live="polite"></span>
          </div>
          <div class="form__full check-wrap">
            <label class="check" for="f-consent"><input type="checkbox" id="f-consent" name="consent" value="yes" required aria-describedby="e-consent"><span data-i18n="contact.consent"></span></label>
            <span class="field__error" id="e-consent" aria-live="polite"></span>
          </div>
          <div class="form__full form__submit">
            <button class="btn" type="submit"><span data-i18n="contact.submit"></span><svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg></button>
            <p class="field__error" id="form-status" role="alert"></p>
          </div>
          <p class="form__full label"><span class="ph" data-i18n="contact.demoNote"></span></p>
        </form>
        <div class="form-success" id="form-success" tabindex="-1" hidden>
          <span class="clause"><span class="clause__mark">§</span><span data-i18n="contact.formTitle"></span></span>
          <h3 data-i18n="contact.successTitle"></h3>
          <p class="muted" data-i18n="contact.successText"></p>
          <button class="btn btn--line" type="button" data-form-again style="justify-self:start"><span data-i18n="contact.successAgain"></span></button>
        </div>
      </div>
    </div>
  </div>
</section>

</main>
<div data-partial="footer"></div>
<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/navigation.js"></script>
<script src="js/animations.js"></script>
<script src="js/landing.js"></script>
<script src="js/main.js"></script>
</body>
</html>
